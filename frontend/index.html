<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Health AI - Detect Coral Reef Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="config.js"></script>
  <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .upload-area {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover { background-color: #f8f9fa; }
        .preview-container { margin-top: 2rem; text-align: center; }
        .preview-image { max-width: 100%; max-height: 400px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .result-container { margin-top: 2rem; padding: 1rem; border-radius: 10px; background-color: #f8f9fa; }
        .loading { display: none; margin: 1rem 0; }
        .history-card { margin-top: 2rem; }
        .history-item { padding: 0.75rem 1rem; border-bottom: 1px solid #e9ecef; }
        .history-item:last-child { border-bottom: none; }
        .healthy { color: #28a745; }
        .damaged { color: #dc3545; }
  </style>
</head>
<body>
    <div class="container main-container">
        <h1 class="text-center mb-4">
            <i class="fas fa-water text-primary"></i>
            Coral Health AI
        </h1>
        <p class="text-center text-muted mb-4">Detect coral reef health using AI technology</p>

        <div class="upload-area" id="dropZone">
            <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
            <h4>Drag & Drop coral reef images here</h4>
            <p class="text-muted">or</p>
            <input type="file" id="imageUpload" accept="image/*" class="d-none">
            <button class="btn btn-primary" onclick="document.getElementById('imageUpload').click()">Choose File</button>
        </div>

        <div class="loading text-center">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            <p class="mt-2">Analyzing image...</p>
        </div>

        <div class="preview-container" id="previewContainer" style="display: none;">
            <img id="preview" class="preview-image" alt="Preview">
        </div>

        <div class="result-container" id="resultContainer" style="display: none;">
            <h3 class="text-center mb-3">Analysis Result</h3>
            <div id="result" class="text-center"></div>
            <div id="confidence" class="text-center mt-2"></div>
            <div id="explanation" class="mt-4 p-3 bg-light rounded"></div>
        </div>

        <div class="card history-card">
            <div class="card-body">
                <h5 class="card-title mb-3">Analysis History</h5>
                <div id="historyList"></div>
                <div id="noHistory" class="text-muted" style="display:none;">No analyses yet. Upload an image to get started.</div>
            </div>
        </div>
    </div>

  <script>
        const API_BASE = window.API_BASE || 'http://localhost:5000';
        const dropZone = document.getElementById('dropZone');
        const imageUpload = document.getElementById('imageUpload');
        const preview = document.getElementById('preview');
        const previewContainer = document.getElementById('previewContainer');
        const resultContainer = document.getElementById('resultContainer');
        const result = document.getElementById('result');
        const confidence = document.getElementById('confidence');
        const loading = document.querySelector('.loading');
        const historyList = document.getElementById('historyList');
        const noHistory = document.getElementById('noHistory');

        function showError(message) {
            resultContainer.style.display = 'block';
            result.innerHTML = `
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle"></i>
                    ${message}
                </div>
            `;
        }

        function validateFile(file) {
            const validTypes = ['image/jpeg', 'image/png', 'image/jpg'];
            const maxSize = 10 * 1024 * 1024; // 10MB
            if (!validTypes.includes(file.type)) throw new Error('Invalid file type. Please upload PNG, JPG, or JPEG.');
            if (file.size > maxSize) throw new Error('File too large. Maximum size is 10MB.');
            return true;
        }

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.backgroundColor = '#f8f9fa'; });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.backgroundColor = 'white'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = 'white';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                try { validateFile(file); handleImage(file); } catch (error) { showError(error.message); }
            } else { showError('Please drop an image file.'); }
        });

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) { try { validateFile(file); handleImage(file); } catch (error) { showError(error.message); } }
        });

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                previewContainer.style.display = 'block';
                resultContainer.style.display = 'none';
                loading.style.display = 'block';

                const formData = new FormData();
                formData.append('image', file);

                fetch(`${API_BASE}/upload`, { method: 'POST', body: formData })
                    .then(response => { if (!response.ok) return response.json().then(d => { throw new Error(d.error || 'Error processing image'); }); return response.json(); })
                    .then(data => {
                        loading.style.display = 'none';
                        resultContainer.style.display = 'block';
                        const healthStatus = data.health_status;
                        const confidenceValue = (data.confidence * 100).toFixed(2);
                        result.innerHTML = `
                            <h2 class="${healthStatus === 'Healthy' ? 'healthy' : 'damaged'}">
                                <i class="fas fa-${healthStatus === 'Healthy' ? 'check-circle' : 'exclamation-circle'}"></i>
                                ${healthStatus}
                            </h2>
                        `;
                        confidence.innerHTML = `
                            <div class="mt-3">
                                <h5 class="mb-2">AI Confidence Level:</h5>
                                <div class="progress" style="height: 25px;">
                                    <div class="progress-bar ${healthStatus === 'Healthy' ? 'bg-success' : 'bg-danger'}" role="progressbar" style="width: ${confidenceValue}%" aria-valuenow="${confidenceValue}" aria-valuemin="0" aria-valuemax="100">${confidenceValue}%</div>
                                </div>
                                <div class="mt-2"><small class="text-muted"><i class="fas fa-info-circle"></i> AI is ${confidenceValue >= 80 ? 'very confident' : confidenceValue >= 60 ? 'fairly confident' : 'less confident'} with this analysis</small></div>
                            </div>
                        `;
                        const explanation = document.getElementById('explanation');
                        if (healthStatus === 'Healthy') {
                            explanation.innerHTML = `
                                <h4 class="text-success mb-3"><i class="fas fa-info-circle"></i> Characteristics of Healthy Coral Reefs:</h4>
                                <ul class="list-unstyled">
                                    <li><i class="fas fa-check text-success"></i> <strong>Color:</strong> Bright and natural color</li>
                                    <li><i class="fas fa-check text-success"></i> <strong>Structure:</strong> Intact shape and structure</li>
                                    <li><i class="fas fa-check text-success"></i> <strong>Diversity:</strong> Contains various types of coral</li>
                                    <li><i class="fas fa-check text-success"></i> <strong>Condition:</strong> No signs of damage or disease</li>
                                </ul>
                            `;
                        } else {
                            explanation.innerHTML = `
                                <h4 class="text-danger mb-3"><i class="fas fa-exclamation-triangle"></i> Characteristics of Damaged Coral Reefs:</h4>
                                <ul class="list-unstyled">
                                    <li><i class="fas fa-times text-danger"></i> <strong>Color:</strong> Faded or unnatural color</li>
                                    <li><i class="fas fa-times text-danger"></i> <strong>Structure:</strong> Visible physical damage or incomplete structure</li>
                                    <li><i class="fas fa-times text-danger"></i> <strong>Condition:</strong> Signs of disease or bleaching</li>
                                    <li><i class="fas fa-times text-danger"></i> <strong>Diversity:</strong> Limited types of living coral</li>
                                </ul>
                            `;
                        }
                        addToHistory(data);
                    })
                    .catch(error => { loading.style.display = 'none'; resultContainer.style.display = 'block'; showError(error.message); });
      };
      reader.readAsDataURL(file);
        }

        function addToHistory(data) {
            noHistory.style.display = 'none';
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item d-flex justify-content-between align-items-center';
            historyItem.innerHTML = `
                <div>
                    <div class="fw-semibold">${data.health_status}</div>
                    <small class="text-muted">${new Date().toLocaleString()}</small>
                </div>
                <span class="badge ${data.health_status === 'Healthy' ? 'bg-success' : 'bg-danger'}">${(data.confidence * 100).toFixed(2)}%</span>
            `;
            historyList.insertBefore(historyItem, historyList.firstChild);
        }

        noHistory.style.display = 'block';
  </script>
</body>
</html>
